[gcode_macro PARK]
gcode:
    {% set xmax = printer.toolhead.axis_maximum.x %}
    {% set xmin = printer.toolhead.axis_minimum.x %}
    {% set ymax = printer.toolhead.axis_maximum.y -1 %}
    {% set speed = params.SPEED|default(12000)|abs %}
    
    {% if "xyz" not in printer.toolhead.homed_axes %}
        G28 ; home if not already homed
        G90 ; absolute position
    {% endif %}

    {% if printer.quad_gantry_level.applied == False %}
        _WIPE                ; wipes before leveling
        QUAD_GANTRY_LEVEL
        G28 Z                ; homes z after leveling
    {% endif %}

    {% if printer.toolhead.position.z < 220 %}
        G91   ; relative position
        G1 Z5 ; moves toolhead up if possible
        G90   ; absolute position
    {% endif %}
    
    G1 X{ ( xmax + xmin ) / 2 } Y{ ymax - 1 } F{speed}   ; park nozzle at rear center