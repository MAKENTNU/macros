
[gcode_macro _PURGE]
gcode:
    {% set PURGE_LENGTH = params.PURGE_LENGTH|default(100)|float %}
    
    G1 X125 Y260 Z10 F10000        ; moves to purge area
    G1 Z1 F10000                 ;moves down to purge
    G1 E{PURGE_LENGTH} F3000    ; purges

    _WIPE


[gcode_macro _WIPE]
variable_brush_y:     257
variable_brush_start: 148
variable_brush_width: 40
variable_brush_top:   1

variable_wipe_spd_xy: 10000
variable_reps: 4

gcode:
    G1 X{brush_start} Y{brush_y} Z{brush_top} F{wipe_spd_xy}
    
    {% for wipes in range(1, reps) %}
        G1 X{brush_start + brush_width} F{wipe_spd_xy}
        G1 X{brush_start} F{wipe_spd_xy}
    {% endfor %}

    G1 X120 Y{brush_y} Z10 F{wipe_spd_xy}