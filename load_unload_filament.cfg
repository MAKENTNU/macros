[gcode_macro LOAD_FILAMENT]
gcode:
    {% set load = params.load|default(70.0)|float %}
    
    ##############
    # TODO: legg inn if setning som sjekker om filament sensor er trigret slig at vi ikke forsøker å loade or det allerede er filament
    # Vanskelig med tanke på at sensoren kommer før extruderen
    #################
    
    FORCE_MOVE STEPPER=extruder DISTANCE={load} VELOCITY={30}

[gcode_macro UNLOAD_FILAMENT]
gcode:
     {% set retract = params.RETRACT|default(90.0)|float %}
     
     FORCE_MOVE STEPPER=extruder DISTANCE=-{retract} VELOCITY={30}