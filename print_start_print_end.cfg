[gcode_macro PRINT_START]
gcode:
    TAP_START_PRINT {rawparams}             ; ensures smouthbrain can't fuck up TAP_START_PRINT


[gcode_macro TAP_START_PRINT]
gcode: 
    {% set EXTRUDER_TEMP = params.EXTRUDER_TEMP|default(215)|float %}
    {% set BED_TEMP = params.BED_TEMP|default(60)|float %}
    {% set VERSION = params.VERSION|default(0)|int %}
    
    {% set purge_length = params.PURGE_LENGTH|default(60)|abs %}
    {% set current_version = 1|int %}    ; update this number to reflect current slicer profile!!!

### checks slicer profile version ###
  {% if VERSION < current_version %}
      RESPOND TYPE=error MSG="Wrong or old slicer profile generated this gcode. Please use correct slicer profile"
      RESPOND TYPE=error MSG="Debug: Triggered by old slicer version"

      G4 P10000
      CANCEL_PRINT
  {% else %}


    {% if "xyz" not in printer.toolhead.homed_axes %}
        M104 S150         ; starts heating/cooling nozzle for probing
    {% endif %}

	M190 S{BED_TEMP}      ; starts heating buildplate
    _CQGL                 ; conditional QGL, usefull if cancel_print was run before current print

    {% if 55 < BED_TEMP < 65 %}
        BED_MESH_PROFILE LOAD="PLA"
        SET_FAN_SPEED FAN=Nevermore SPEED=0
        SET_FAN_SPEED FAN=Exhaust SPEED=0.8
    {% endif %}

    {% if 90 < BED_TEMP < 110 %}
        BED_MESH_PROFILE LOAD="ABS"
        SET_FAN_SPEED FAN=Nevermore SPEED=0.8
        SET_FAN_SPEED FAN=Exhaust SPEED=0.1
    {% endif %}
    
    PARK                  ; parks to avoid oozing on the bed
	M109 S{EXTRUDER_TEMP} ; heats up nozzle after levling
    _PURGE PURGE_LENGTH={purge_length}
    
    SET_LED LED="hotend_rgb" RED=1 GREEN=1 BLUE=1 WHITE=1 SYNC=0 TRANSMIT=1
    ; sets LEDs to white while printing
  {% endif %}


[gcode_macro PRINT_END]
#   Use PRINT_END for the slicer ending script - please customise for your slicer of choice
gcode:
    SAVE_GCODE_STATE NAME=STATE_PRINT_END

    M400                           ; wait for buffer to clear
    G92 E0                         ; zero the extruder
    G1 E-10.0 F3600                ; retract filament

    M220 S100                      ; resets speed
    G91                            ; relative positioning
    G0 Z1 X0 Y0 F20000             ; move nozzle to remove stringing
    G90                            ; absolute positioning
    TURN_OFF_HEATERS
    SET_FAN_SPEED FAN=Exhaust SPEED=0
    SET_FAN_SPEED FAN=Nevermore SPEED=0
    M107                           ; turn off fan
    PARK                           ; parks toolhead
    M84                            ; disables steppers
    #SET_GCODE_OFFSET Z=0 MOVE=0    ; clears z-offset
    BED_MESH_CLEAR
    
    # The purpose of the SAVE_GCODE_STATE/RESTORE_GCODE_STATE
    # command pair is to restore the printer's coordinate system
    # and speed settings since the commands above change them.
    # However, to prevent any accidental, unintentional toolhead
    # moves when restoring the state, explicitly set MOVE=0.
    RESTORE_GCODE_STATE NAME=STATE_PRINT_END MOVE=0

